<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Unidad 2 - Formularios HTML5</title>
</head>
<body>

  <h1>Unidad 2 - Formularios y Validaciones HTML5</h1>

  <!-- Ejercicio 1: formulario con nombre, correo, contraseña y botón enviar -->
  <h2>Ejercicio 1</h2>
  <form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">
    <br><br>

    <label for="correo">Correo:</label>
    <input type="email" id="correo" name="correo">
    <br><br>

    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena">
    <br><br>

    <button type="submit">Enviar</button>
  </form>

  <hr>

  <!-- Ejercicio 2: validaciones - campos obligatorios y edad con rango -->
  <h2>Ejercicio 2</h2>
  <form>
    <label for="nombre2">Nombre:</label>
    <input type="text" id="nombre2" name="nombre" required>
    <br><br>

    <label for="correo2">Correo:</label>
    <input type="email" id="correo2" name="correo" required>
    <br><br>

    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" min="1" max="100" required>
    <br><br>

    <button type="submit">Enviar</button>
  </form>

  <hr>

  <!-- Ejercicio 3: etiquetas label a cada campo -->
  <h2>Ejercicio 3</h2>
  <form>
    <label for="nombre3">Nombre:</label>
    <input type="text" id="nombre3" name="nombre" required>
    <br><br>

    <label for="correo3">Correo:</label>
    <input type="email" id="correo3" name="correo" required>
    <br><br>

    <label for="edad3">Edad:</label>
    <input type="number" id="edad3" name="edad" min="1" max="100" required>
    <br><br>

    <label for="contrasena3">Contraseña:</label>
    <input type="password" id="contrasena3" name="contrasena" required>
    <br><br>

    <button type="submit">Enviar</button>
  </form>

  <hr>

  <!-- Ejercicio 4 (Reto): formulario completo -->
  <h2>Ejercicio 4 - Reto</h2>
  <form>
    <label for="nombre4">Nombre:</label>
    <input type="text" id="nombre4" name="nombre" required>
    <br><br>

    <label for="correo4">Correo:</label>
    <input type="email" id="correo4" name="correo" required>
    <br><br>

    <label for="edad4">Edad:</label>
    <input type="number" id="edad4" name="edad" min="1" max="100" required>
    <br><br>

    <label for="fecha">Fecha de nacimiento:</label>
    <input type="date" id="fecha" name="fecha" required>
    <br><br>

    <label for="contrasena4">Contraseña:</label>
    <input type="password" id="contrasena4" name="contrasena" required>
    <br><br>

    <button type="submit">Enviar</button>
  </form>

</body>
</html>
